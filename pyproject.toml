[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "RAG from scratch implementations and pipelines"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "advanced_RAG*",
    "pipeline*",
    "query_structuring*",
    "query_translation*",
    "Reranking*",
    "routing*",
    "advanced_indexing*"
]
